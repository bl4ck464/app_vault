<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير التطبيقات - APK Vault</title>
    <style>
        :root {
            --bg: #080808;
            --surface: #111;
            --surface-raised: #171717;
            --border: #2a2a2a;
            --muted: #929292;
            --text: #f0f0f0;
            --lime: #b6ff00;
            --warning: #ffb000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 32px 20px 64px;
            max-width: 960px;
            margin: auto;
        }

        header { margin-bottom: 30px; }
        h1 { display: flex; align-items: center; gap: 12px; color: var(--text); margin-bottom: 10px; font-size: clamp(24px, 5vw, 34px); }
        h1 .icon { color: var(--lime); }
        .intro { color: var(--muted); max-width: 680px; line-height: 1.7; }
        .form-section { padding: 24px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
        .form-section h2 { margin-bottom: 18px; color: var(--text); font-size: 16px; }
        .form-section h2::after { content: ''; display: block; width: 28px; height: 2px; margin-top: 8px; background: var(--lime); }
        .form-group { margin-bottom: 16px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; font-weight: bold; margin-bottom: 7px; color: #aaa; font-size: 12px; }
        input, textarea, select {
            width: 100%;
            padding: 12px 13px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--lime); outline: 2px solid rgba(182,255,0,.12); }
        input[type="file"] { padding: 9px; font-size: 12px; }
        textarea { resize: vertical; min-height: 88px; }
        .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .row .form-group { flex: 1; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: #b6ff00;
            color: #0a0a0a;
            border: none;
            min-height: 44px;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 0 20px #b6ff0044; }
        button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .btn-secondary { background: #292929; color: white; }
        .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .preview-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            color: #b6ff00;
        }
        #status { padding: 14px 16px; color: var(--lime); margin-top: 16px; background: rgba(182,255,0,.06); border: 1px solid rgba(182,255,0,.25); border-radius: 10px; font-size: 13px; line-height: 1.8; }
        #status:empty { display: none; }
        .status-warning { color: var(--warning); }

        @media (max-width: 620px) {
            body { padding: 24px 14px 48px; }
            .form-section { padding: 18px; }
            .row { grid-template-columns: 1fr; gap: 0; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M12 21v-9.5M4.5 7.5 12 12l7.5-4.5"/></svg>
            إضافة تطبيق جديد إلى APK Vault
        </h1>
        <p class="intro">املأ البيانات، اختر الملفات، ثم أنشئ ملف JSON وروابط تحميل الملفات.</p>
    </header>

    <form id="appForm">
        <section class="form-section">
            <h2>معلومات التطبيق</h2>
        <div class="row">
            <div class="form-group">
                <label>معرف التطبيق (ID) *</label>
                <input type="text" id="appId" placeholder="مثال: tryagain" required>
            </div>
            <div class="form-group">
                <label>اسم التطبيق *</label>
                <input type="text" id="appName" placeholder="مثال: TryAgain" required>
            </div>
        </div>

        <div class="form-group">
            <label>الوصف القصير *</label>
            <input type="text" id="appDesc" placeholder="وصف مختصر (يظهر في البطاقة)" required>
        </div>

        <div class="form-group">
            <label>الوصف الطويل</label>
            <textarea id="appLongDesc" rows="3" placeholder="وصف مفصل للتطبيق"></textarea>
        </div>
        </section>

        <section class="form-section">
            <h2>الإصدار والتوافق</h2>
            <div class="row">
                <div class="form-group">
                    <label>التصنيف *</label>
                    <input type="text" id="appCategory" placeholder="مثال: Productivity" required>
                </div>
                <div class="form-group">
                    <label>الإصدار *</label>
                    <input type="text" id="appVersion" placeholder="مثال: 1.0.0" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>نظام الأندرويد *</label>
                    <input type="text" id="appAndroid" placeholder="مثال: Android 7.0+" required>
                </div>
                <div class="form-group">
                    <label>تاريخ التحديث</label>
                    <input type="text" id="appUpdated" placeholder="مثال: August 2026">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>المطور *</label>
                    <input type="text" id="appDeveloper" placeholder="اسم المطور" required>
                </div>
                <div class="form-group">
                    <label>التقييم (من 5)</label>
                    <input type="number" id="appRating" step="0.1" min="0" max="5" value="4.5">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>عدد التحميلات</label>
                    <input type="number" id="appDownloads" value="0">
                </div>
                <div class="form-group">
                    <label>قابل لإعادة التوزيع؟</label>
                    <select id="appRedistributable">
                        <option value="true">نعم</option>
                        <option value="false">لا</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>الميزات والملفات</h2>

        <div class="form-group">
            <label>الميزات (اكتب كل ميزة في سطر جديد)</label>
            <textarea id="appFeatures" rows="3" placeholder="ميزة 1&#10;ميزة 2&#10;ميزة 3"></textarea>
        </div>

        <div class="form-group">
            <label>أيقونة التطبيق (png/jpg)</label>
            <input type="file" id="appIcon" accept="image/*">
        </div>

        <div class="form-group">
            <label>لقطات الشاشة (اختر عدة صور)</label>
            <input type="file" id="appScreenshots" accept="image/*" multiple>
        </div>

        <div class="form-group">
            <label>ملف APK *</label>
            <input type="file" id="appApk" accept=".apk" required>
        </div>
        </section>

        <div class="actions">
            <button type="button" id="generateBtn">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 9-12h-7z"/></svg>
                توليد وتنزيل الملفات
            </button>
            <button type="button" id="loadExistingBtn" class="btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
                تحميل app.json الموجود
            </button>
        </div>
    </form>

    <div id="status"></div>
    <div id="jsonPreview" class="preview-box" style="display:none;"></div>

    <script>
        (function() {
            // متغيرات لتخزين الملفات المختارة
            let existingApps = [];
            let selectedApkFile = null;
            let selectedIconFile = null;
            let selectedScreenshots = [];

            // حقول النموذج
            const getVal = (id) => document.getElementById(id).value.trim();
            const getFile = (id) => document.getElementById(id).files[0];
            const getFiles = (id) => document.getElementById(id).files;

            // حساب حجم الملف
            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            // قراءة الملفات كـ Data URL (للتخزين المؤقت)
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // قراءة ملف APK لحساب الحجم
            document.getElementById('appApk').addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    selectedApkFile = this.files[0];
                    // محاولة تعيين الحجم تلقائياً
                    const size = formatSize(selectedApkFile.size);
                    // نضع الحجم في حقل مخفي أو نعرضه فقط
                    document.getElementById('status').innerHTML = `حجم APK: ${size}`;
                }
            });

            document.getElementById('appIcon').addEventListener('change', function(e) {
                if (this.files.length > 0) selectedIconFile = this.files[0];
            });

            document.getElementById('appScreenshots').addEventListener('change', function(e) {
                selectedScreenshots = Array.from(this.files);
            });

            // تحميل app.json الموجود
            document.getElementById('loadExistingBtn').addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (Array.isArray(data)) {
                                existingApps = data;
                                document.getElementById('status').innerHTML = `تم تحميل ${existingApps.length} تطبيق من app.json`;
                            } else {
                                alert('الملف غير صحيح! يجب أن يكون مصفوفة.');
                            }
                        } catch (err) {
                            alert('خطأ في قراءة JSON: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            });

            // زر التوليد
            document.getElementById('generateBtn').addEventListener('click', async function() {
                const id = getVal('appId');
                const name = getVal('appName');
                const desc = getVal('appDesc');
                const longDesc = getVal('appLongDesc') || desc;
                const category = getVal('appCategory');
                const version = getVal('appVersion');
                const android = getVal('appAndroid');
                const updated = getVal('appUpdated') || new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
                const developer = getVal('appDeveloper');
                const rating = parseFloat(getVal('appRating')) || 0;
                const downloads = parseInt(getVal('appDownloads')) || 0;
                const redistributable = document.getElementById('appRedistributable').value === 'true';
                const featuresText = document.getElementById('appFeatures').value;
                const features = featuresText.split('\n').filter(f => f.trim() !== '');

                // التحقق من الحقول الأساسية
                if (!id || !name || !desc || !category || !version || !android || !developer || !selectedApkFile) {
                    alert('يرجى تعبئة جميع الحقول الأساسية (المطلوبة) واختيار ملف APK.');
                    return;
                }

                // حساب مسار الملفات (بناءً على التسمية)
                const iconPath = `assets/${id}.png`; 
                // ملاحظة: سنفترض أن المستخدم سيحفظ الصور بهذه التسمية، أو سنقوم بتنزيلها بهذه التسمية.

                const apkPath = `apks/${id}.apk`;
                const screenshotsPaths = selectedScreenshots.map((f, i) => `assets/${id}-${i+1}.png`);

                // بناء كائن التطبيق
                const newApp = {
                    id: id,
                    name: name,
                    description: desc,
                    longDescription: longDesc,
                    category: category,
                    version: version,
                    size: formatSize(selectedApkFile.size),
                    rating: rating,
                    downloads: downloads,
                    android: android,
                    updated: updated,
                    developer: developer,
                    redistributable: redistributable,
                    icon: iconPath,
                    apk: apkPath,
                    screenshots: screenshotsPaths,
                    features: features
                };

                // دمج مع القائمة الموجودة (تجنب التكرار)
                const existingIndex = existingApps.findIndex(a => a.id === id);
                if (existingIndex !== -1) {
                    if (!confirm(`تطبيق "${name}" موجود بالفعل! هل تريد استبداله؟`)) return;
                    existingApps[existingIndex] = newApp;
                } else {
                    existingApps.push(newApp);
                }

                // توليد JSON النهائي
                const finalJson = JSON.stringify(existingApps, null, 4);

                // عرض معاينة JSON
                const previewDiv = document.getElementById('jsonPreview');
                previewDiv.style.display = 'block';
                previewDiv.textContent = finalJson;

                // 1. تنزيل app.json
                const jsonBlob = new Blob([finalJson], { type: 'application/json' });
                const jsonUrl = URL.createObjectURL(jsonBlob);
                const jsonLink = document.createElement('a');
                jsonLink.href = jsonUrl;
                jsonLink.download = 'app.json';
                jsonLink.click();
                URL.revokeObjectURL(jsonUrl);

                // 2. تنزيل ملفات الأصول (APK والصور)
                // سيتم تنزيلها كملفات منفصلة مع التسمية الصحيحة
                const downloadFile = (file, suggestedName) => {
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = suggestedName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                // تنزيل APK
                downloadFile(selectedApkFile, `${id}.apk`);

                // تنزيل الأيقونة
                if (selectedIconFile) {
                    const ext = selectedIconFile.name.split('.').pop();
                    downloadFile(selectedIconFile, `${id}.${ext}`);
                } else {
                    alert('تنبيه: لم تختر أيقونة. ستحتاج إلى وضع أيقونة باسم ' + iconPath);
                }

                // تنزيل اللقطات
                if (selectedScreenshots.length > 0) {
                    selectedScreenshots.forEach((file, i) => {
                        const ext = file.name.split('.').pop();
                        downloadFile(file, `${id}-${i+1}.${ext}`);
                    });
                }

                document.getElementById('status').innerHTML = `
                    تم إنشاء وتنزيل الملفات بنجاح!
                    <br>app.json محدث
                    <br>${selectedApkFile.name} -> ${apkPath}
                    <br>${selectedScreenshots.length} لقطة شاشة
                    <br><span class="status-warning">الآن قم بنقل هذه الملفات إلى مجلد المشروع ورفعها إلى GitHub.</span>
                `;

            });

        })();
    </script>

</body>
</html>
